<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="競馬EV">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>競馬期待値計算アプリ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .venue-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .venue-tab {
            padding: 12px 24px;
            background: var(--surface);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .venue-tab:hover {
            background: var(--surface-light);
        }

        .venue-tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .race-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .race-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .race-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.2);
        }

        .race-card.selected {
            border-color: var(--primary);
            background: linear-gradient(135deg, var(--surface), rgba(99, 102, 241, 0.1));
        }

        .race-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .race-name {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .race-time {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .race-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-g1 {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000;
        }

        .badge-g2 {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            color: #fff;
        }

        .badge-ev {
            background: var(--success);
            color: #fff;
        }

        .section {
            background: var(--surface);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section h2 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .bet-type-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .bet-tab {
            padding: 10px 18px;
            background: var(--surface-light);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .bet-tab.active {
            background: var(--primary);
        }

        .ev-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ev-table th,
        .ev-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .ev-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .ev-table tr:hover {
            background: var(--surface-light);
        }

        .horse-name {
            font-weight: 600;
        }

        .ev-value {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .ev-high {
            color: var(--warning);
        }

        .ev-medium {
            color: var(--success);
        }

        .ev-low {
            color: var(--text-muted);
        }

        .odds-badge {
            display: inline-block;
            padding: 4px 10px;
            background: var(--surface-light);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .factor-badges {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .factor-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .factor-condition {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .factor-gate {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        .factor-track {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .factor-content {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--surface-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .summary-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .recommendation-card {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            border-left: 4px solid var(--success);
            transition: all 0.3s;
        }

        .recommendation-card:hover {
            transform: translateX(5px);
        }

        .recommendation-card.high-ev {
            border-left-color: var(--warning);
        }

        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .rec-race {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .rec-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .rec-item {
            display: flex;
            flex-direction: column;
        }

        .rec-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .rec-value {
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            header h1 {
                font-size: 1.4rem;
            }

            .race-grid {
                grid-template-columns: 1fr 1fr;
            }

            .ev-table {
                font-size: 0.85rem;
            }

            .summary-cards {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .race-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🏇 競馬期待値計算アプリ</h1>
            <p>リアルタイム情報収集 × 改良版期待値エンジン</p>
        </header>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot"></span>
                <span id="currentTime">読み込み中...</span>
            </div>
            <div class="status-item">
                <span id="raceCount">0レース</span> 開催中
            </div>
            <button class="btn btn-primary" onclick="refreshAll()">
                🔄 更新
            </button>
        </div>

        <div class="summary-cards">
            <div class="summary-card">
                <div class="summary-value" id="totalEv100">0</div>
                <div class="summary-label">EV100%超 馬券数</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="winRecCount">0</div>
                <div class="summary-label">単勝おすすめ</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="placeRecCount">0</div>
                <div class="summary-label">複勝おすすめ</div>
            </div>
            <div class="summary-card">
                <div class="summary-value" id="trifectaRecCount">0</div>
                <div class="summary-label">3連単おすすめ</div>
            </div>
        </div>

        <div class="venue-tabs">
            <div class="venue-tab active" onclick="filterVenue('all')">すべて</div>
            <div class="venue-tab" onclick="filterVenue('nakayama')">🏟️ 中山</div>
            <div class="venue-tab" onclick="filterVenue('hanshin')">🏟️ 阪神</div>
        </div>

        <div id="raceList" class="race-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>レース情報を取得中...</p>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2>💰 推奨馬券 <span class="badge badge-success" id="recBadge">0件</span></h2>
            </div>

            <div class="bet-type-tabs">
                <div class="bet-tab active" onclick="filterBetType('all')">すべて</div>
                <div class="bet-tab" onclick="filterBetType('win')">単勝</div>
                <div class="bet-tab" onclick="filterBetType('place')">複勝</div>
                <div class="bet-tab" onclick="filterBetType('trifecta')">3連単</div>
            </div>

            <div id="recommendations">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>期待値を計算中...</p>
                </div>
            </div>
        </div>

        <div class="section" id="raceDetailSection" style="display: none;">
            <div class="section-header">
                <h2 id="selectedRaceName">📊 レース詳細</h2>
            </div>
            <table class="ev-table">
                <thead>
                    <tr>
                        <th>馬番</th>
                        <th>馬名</th>
                        <th>騎手</th>
                        <th>オッズ</th>
                        <th>予測勝率</th>
                        <th>期待値</th>
                        <th>補正要素</th>
                    </tr>
                </thead>
                <tbody id="horseTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        let allRaces = [];
        let allRecommendations = [];
        let currentVenue = 'all';
        let currentBetType = 'all';

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            updateTime();
            setInterval(updateTime, 1000);
            loadRaces();
            loadRecommendations();
        });

        function updateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('currentTime').textContent = now.toLocaleDateString('ja-JP', options);
        }

        async function loadRaces() {
            const container = document.getElementById('raceList');
            try {
                const resp = await fetch('/api/races');
                const data = await resp.json();
                allRaces = data.races;
                document.getElementById('raceCount').textContent = `${allRaces.length}レース`;
                renderRaces();
            } catch (err) {
                container.innerHTML = `<div class="loading"><p>エラー: ${err.message}</p></div>`;
            }
        }

        function renderRaces() {
            const container = document.getElementById('raceList');
            let filtered = allRaces;

            if (currentVenue === 'nakayama') {
                filtered = allRaces.filter(r => r.race_name.includes('中山'));
            } else if (currentVenue === 'hanshin') {
                filtered = allRaces.filter(r => r.race_name.includes('阪神'));
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="loading"><p>該当するレースがありません</p></div>';
                return;
            }

            container.innerHTML = filtered.map(race => {
                const match = race.race_name.match(/(\d+)R/);
                const raceNum = match ? match[1] : '?';
                const isG1 = race.race_name.includes('G1') || race.race_name.includes('有馬');
                const isG2 = race.race_name.includes('G2');

                let badgeHtml = '';
                if (isG1) badgeHtml = '<span class="race-badge badge-g1">G1</span>';
                else if (isG2) badgeHtml = '<span class="race-badge badge-g2">G2</span>';

                return `
                    <div class="race-card" onclick="selectRace('${race.race_id}', this)">
                        ${badgeHtml}
                        <div class="race-number">${raceNum}</div>
                        <div class="race-name">${race.race_name}</div>
                    </div>
                `;
            }).join('');
        }

        async function loadRecommendations() {
            const container = document.getElementById('recommendations');
            try {
                const resp = await fetch('/api/recommend?min_ev=1.0');
                const data = await resp.json();
                allRecommendations = data.recommendations;

                // サマリー更新
                document.getElementById('totalEv100').textContent = allRecommendations.length;
                document.getElementById('winRecCount').textContent = allRecommendations.filter(r => r.type === 'win').length;
                document.getElementById('placeRecCount').textContent = allRecommendations.filter(r => r.type === 'place').length;
                document.getElementById('trifectaRecCount').textContent = allRecommendations.filter(r => r.type === 'trifecta').length;

                renderRecommendations();
            } catch (err) {
                container.innerHTML = `<div class="loading"><p>エラー: ${err.message}</p></div>`;
            }
        }

        function renderRecommendations() {
            const container = document.getElementById('recommendations');
            let filtered = allRecommendations;

            if (currentBetType !== 'all') {
                filtered = allRecommendations.filter(r => r.type === currentBetType);
            }

            document.getElementById('recBadge').textContent = `${filtered.length}件`;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="loading"><p>該当する推奨馬券がありません</p></div>';
                return;
            }

            const typeNames = { 'win': '単勝', 'place': '複勝', 'trifecta': '3連単' };

            container.innerHTML = filtered.slice(0, 30).map(rec => {
                const isHigh = rec.ev >= 1.5;
                const evClass = rec.ev >= 1.5 ? 'ev-high' : (rec.ev >= 1.2 ? 'ev-medium' : '');

                const target = rec.type === 'trifecta'
                    ? rec.combination
                    : `#${rec.number} ${rec.name}`;

                // 補正要素のバッジ
                let factorHtml = '';
                if (rec.condition_factor > 1.0) {
                    factorHtml += `<span class="factor-badge factor-condition">状態+${((rec.condition_factor - 1) * 100).toFixed(0)}%</span>`;
                }
                if (rec.horse_course_aptitude > 1.0) {
                    factorHtml += `<span class="factor-badge factor-track">コース適性+${((rec.horse_course_aptitude - 1) * 100).toFixed(0)}%</span>`;
                }
                if (rec.gate_factor && rec.gate_factor > 1.0) {
                    factorHtml += `<span class="factor-badge factor-gate">内枠有利</span>`;
                }

                return `
                    <div class="recommendation-card ${isHigh ? 'high-ev' : ''}">
                        <div class="rec-header">
                            <div>
                                <span class="badge badge-${isHigh ? 'warning' : 'success'}">${typeNames[rec.type]}</span>
                                <strong style="margin-left: 10px;">${target}</strong>
                            </div>
                            <div class="ev-value ${evClass}">${rec.ev_percent.toFixed(0)}%</div>
                        </div>
                        <div class="rec-race">${rec.race_name || ''}</div>
                        ${factorHtml ? `<div class="factor-badges" style="margin-top: 8px;">${factorHtml}</div>` : ''}
                        <div class="rec-details" style="margin-top: 12px;">
                            <div class="rec-item">
                                <span class="rec-label">オッズ</span>
                                <span class="rec-value">${rec.odds.toFixed(1)}倍</span>
                            </div>
                            <div class="rec-item">
                                <span class="rec-label">予測確率</span>
                                <span class="rec-value">${(rec.predicted_prob * 100).toFixed(1)}%</span>
                            </div>
                            <div class="rec-item">
                                <span class="rec-label">推奨賭け金</span>
                                <span class="rec-value">${rec.kelly_bet?.toLocaleString() || '-'}円</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function selectRace(raceId, element) {
            // 選択状態を更新
            document.querySelectorAll('.race-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');

            // レース詳細を表示
            const section = document.getElementById('raceDetailSection');
            section.style.display = 'block';

            try {
                const resp = await fetch(`/api/ev/${raceId}`);
                const data = await resp.json();

                document.getElementById('selectedRaceName').textContent = `📊 ${data.race_name}`;

                // 馬一覧テーブル
                const winEvs = await fetch(`/api/ev/${raceId}`).then(r => r.json());
                const tbody = document.getElementById('horseTable');

                // EVデータを取得
                const evResp = await fetch(`/api/ev/${raceId}?min_ev=0`);
                const evData = await evResp.json();

                if (evData.recommendations && evData.recommendations.win) {
                    tbody.innerHTML = evData.recommendations.win.map(h => {
                        const evClass = h.ev >= 1.5 ? 'ev-high' : (h.ev >= 1.0 ? 'ev-medium' : 'ev-low');

                        let factors = [];
                        if (h.condition_factor > 1.0) factors.push(`<span class="factor-badge factor-condition">状態◎</span>`);
                        if (h.horse_course_aptitude > 1.0) factors.push(`<span class="factor-badge factor-track">コース◎</span>`);
                        if (h.jockey_course_aptitude > 1.0) factors.push(`<span class="factor-badge factor-gate">騎手◎</span>`);

                        return `
                            <tr>
                                <td><strong>${h.number}</strong></td>
                                <td class="horse-name">${h.name}</td>
                                <td>${h.jockey || '-'}</td>
                                <td><span class="odds-badge">${h.odds.toFixed(1)}倍</span></td>
                                <td>${(h.predicted_prob * 100).toFixed(1)}%</td>
                                <td><span class="ev-value ${evClass}">${h.ev_percent.toFixed(0)}%</span></td>
                                <td><div class="factor-badges">${factors.join('')}</div></td>
                            </tr>
                        `;
                    }).join('');
                }

                section.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                console.error(err);
            }
        }

        function filterVenue(venue) {
            currentVenue = venue;
            document.querySelectorAll('.venue-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderRaces();
        }

        function filterBetType(type) {
            currentBetType = type;
            document.querySelectorAll('.bet-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderRecommendations();
        }

        function refreshAll() {
            loadRaces();
            loadRecommendations();
        }

        // Service Worker登録（PWA対応）
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }
    </script>
</body>
